<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Broadcable SOA SMS Maker</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: #fff;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
      }

      .panel {
        border: 1px solid #333;
        border-radius: 28px;
        padding: 30px;
        background: #050505;
      }

      h1 {
        color: #9ecbff;
        margin-bottom: 30px;
        font-size: 48px;
      }

      h2 {
        color: #9ecbff;
        margin-bottom: 25px;
        font-size: 30px;
      }

      .form-group {
        margin-bottom: 24px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: 700;
      }

      input,
      textarea {
        width: 100%;
        background: #000;
        border: 2px solid #333;
        color: #fff;
        padding: 18px 20px;
        border-radius: 18px;
        font-size: 18px;
        outline: none;
      }

      input:focus,
      textarea:focus {
        border-color: #2563eb;
      }

      textarea {
        min-height: 650px;
        resize: none;
        line-height: 1.7;
      }

      /* REMOVE NUMBER INPUT ARROWS */

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }

      /* IMPROVED DATE INPUT */

      .date-wrapper {
        position: relative;
      }

      .custom-date {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;

        width: 100%;
        background: #000;
        border: 2px solid #333;
        color: #fff;
        padding: 18px 20px;
        border-radius: 18px;
        font-size: 22px;
        outline: none;
        min-height: 72px;
      }

      .custom-date:focus {
        border-color: #2563eb;
      }

      .custom-date::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
        opacity: 0.9;
        transform: scale(1.4);
      }

      .custom-date::-webkit-datetime-edit {
        color: #fff;
      }

      .custom-date::-webkit-datetime-edit-fields-wrapper {
        padding: 0;
      }

      .custom-date::-webkit-datetime-edit-text {
        color: #888;
        padding: 0 4px;
      }

      .custom-date::-webkit-datetime-edit-month-field,
      .custom-date::-webkit-datetime-edit-day-field,
      .custom-date::-webkit-datetime-edit-year-field {
        color: #fff;
        background: transparent;
      }

      .custom-date::-webkit-inner-spin-button {
        display: none;
      }

      /* BUTTONS */

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 16px 26px;
        border-radius: 16px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        opacity: 0.9;
      }

      .clear-btn {
        background: #1f1f1f;
      }

      .stats {
        margin-top: 18px;
        color: #999;
        font-size: 14px;
      }

      .copy-status {
        margin-top: 12px;
        color: #22c55e;
        font-size: 14px;
      }

      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .hidden {
        display: none;
      }

      /* MOBILE */

      @media (max-width: 1000px) {
        body {
          padding: 14px;
        }

        .container {
          grid-template-columns: 1fr;
        }

        .panel {
          padding: 22px;
          border-radius: 22px;
        }

        h1 {
          font-size: 36px;
        }

        h2 {
          font-size: 26px;
        }

        textarea {
          min-height: 500px;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- LEFT PANEL -->

      <div class="panel">
        <h1>Subscriber Details</h1>

        <div class="toggle-row">
          <label style="margin-bottom: 0">Subscriber Info</label>
          <label style="margin-bottom: 0; font-size: 14px; font-weight: 400">
            <input
              type="checkbox"
              id="separateToggle"
              style="width: auto; margin-right: 6px"
            />
            Separate Fields
          </label>
        </div>

        <div class="form-group" id="combinedGroup">
          <input
            type="text"
            id="subscriberInfo"
            placeholder="Example: Ryan Cunanan | 540003181"
          />
        </div>

        <div id="separateGroup" class="hidden">
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="customerName" />
          </div>

          <div class="form-group">
            <label>Account Number</label>
            <input type="text" id="accountNumber" />
          </div>
        </div>

        <div class="form-group">
          <label>Service Plan</label>

          <input type="text" id="servicePlan" placeholder="Example: 100 MBPS" />
        </div>

        <div class="form-group">
          <label>Due Date / Billing End Date</label>

          <div class="date-wrapper">
            <input type="date" id="dueDate" class="custom-date" />
          </div>
        </div>

        <div class="form-group">
          <label>Current Bill</label>

          <input
            type="text"
            id="currentBill"
            placeholder="0.00"
            inputmode="decimal"
          />
        </div>

        <div class="actions">
          <button onclick="copySMS()">Copy SMS</button>
          <button onclick="copyCorrectionMessage()">
            Copy Correction Message
          </button>
          <button class="clear-btn" onclick="clearForm()">Clear Form</button>
        </div>
      </div>

      <!-- RIGHT PANEL -->

      <div class="panel">
        <h2>SMS Preview</h2>

        <textarea id="smsPreview" readonly></textarea>

        <div class="copy-status" id="copyStatus"></div>

        <div class="stats" id="smsStats">Characters: 0 | SMS Parts: 0</div>
      </div>
    </div>

    <script>
      const fields = [
        "subscriberInfo",
        "customerName",
        "accountNumber",
        "servicePlan",
        "dueDate",
        "currentBill",
      ];

      fields.forEach((id) => {
        document.getElementById(id).addEventListener("input", () => {
          if (id === "servicePlan") {
            autoFillCurrentBill();
          }

          updatePreview();
        });
      });

      document
        .getElementById("separateToggle")
        .addEventListener("change", () => {
          const enabled = document.getElementById("separateToggle").checked;

          if (enabled) {
            const parsed = parseSubscriberInfo(
              document.getElementById("subscriberInfo").value,
            );

            document.getElementById("customerName").value = parsed.name;
            document.getElementById("accountNumber").value = parsed.account;

            document.getElementById("combinedGroup").classList.add("hidden");
            document.getElementById("separateGroup").classList.remove("hidden");
          } else {
            const name = document.getElementById("customerName").value.trim();
            const account = document
              .getElementById("accountNumber")
              .value.trim();

            document.getElementById("subscriberInfo").value =
              name || account ? `${name} | ${account}` : "";

            document.getElementById("combinedGroup").classList.remove("hidden");
            document.getElementById("separateGroup").classList.add("hidden");
          }

          updatePreview();
        });

      function formatText(text) {
        return text.toUpperCase();
      }

      function formatDate(dateString) {
        if (!dateString) return "";

        const date = new Date(dateString);

        return date.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }

      function calculateStartDate(dueDateString) {
        if (!dueDateString) return "";

        const dueDate = new Date(dueDateString);

        const startDate = new Date(dueDate);

        startDate.setMonth(startDate.getMonth() - 1);

        return startDate;
      }

      function calculateDisconnectionDate(dueDateString) {
        if (!dueDateString) return "";

        const disconnectionDate = new Date(dueDateString);

        disconnectionDate.setDate(disconnectionDate.getDate() + 3);

        return disconnectionDate;
      }

      /* AUTO SPLIT NAME + ACCOUNT NUMBER */

      function parseSubscriberInfo(text) {
        if (!text.includes("|")) {
          return {
            name: text,
            account: "",
          };
        }

        const parts = text.split("|");

        return {
          name: parts[0].trim(),
          account: parts[1].trim(),
        };
      }
      function autoFillCurrentBill() {
        const servicePlan = document
          .getElementById("servicePlan")
          .value.trim()
          .toLowerCase();

        const currentBillField = document.getElementById("currentBill");

        const plans = {
          bronze: "750",
          silver: "1100",
          gold: "1500",
          "bronze with catv": "900",
          "silver with catv": "1250",
          "gold with catv": "1650",
        };

        if (plans.hasOwnProperty(servicePlan)) {
          currentBillField.value = plans[servicePlan];
        } else {
          currentBillField.value = "";
        }
      }

      function updatePreview() {
        let parsed;

        if (document.getElementById("separateToggle").checked) {
          parsed = {
            name: document.getElementById("customerName").value,
            account: document.getElementById("accountNumber").value,
          };
        } else {
          const subscriberRaw = document.getElementById("subscriberInfo").value;
          parsed = parseSubscriberInfo(subscriberRaw);
        }

        const customerName = formatText(parsed.name) || "[CUSTOMER NAME]";

        const accountNumber = formatText(parsed.account) || "[ACCOUNT NUMBER]";

        const servicePlan =
          formatText(document.getElementById("servicePlan").value) ||
          "[SERVICE PLAN]";

        const dueDateValue = document.getElementById("dueDate").value;

        const currentBill = parseFloat(
          document.getElementById("currentBill").value,
        );

        const amount = !isNaN(currentBill)
          ? currentBill.toLocaleString("en-PH", {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2,
            })
          : "0.00";

        const dueDate = dueDateValue ? formatDate(dueDateValue) : "[DUE DATE]";

        const startDate = dueDateValue
          ? formatDate(calculateStartDate(dueDateValue))
          : "[START DATE]";

        const disconnectionDate = dueDateValue
          ? formatDate(calculateDisconnectionDate(dueDateValue))
          : "[DISCONNECTION DATE]";

        const sms = `BROADCABLE SOA

Hello! ${customerName}, this is a friendly reminder for your subscription under Account No. ${accountNumber}. Your ${servicePlan} subscription for the billing period of ${startDate} to ${dueDate} has a current bill of PHP ${amount}. Please settle your account before the disconnection date on ${disconnectionDate}.

For GCash payments, you may send to ED**** A.B. - 09175861966 or MI****E CH******E B. - 09776638570. Kindly indicate your Name & Account No. in the optional message section when sending payment. After payment, please send your payment screenshot to our Facebook page. Payments without a Name & Account No. may not be acknowledged or verified properly.

If you have already settled your account, please disregard this message.

Thank you!`;

        document.getElementById("smsPreview").value = sms;

        updateStats(sms);
      }

      function updateStats(text) {
        const characters = text.length;

        const smsParts = characters === 0 ? 0 : Math.ceil(characters / 160);

        document.getElementById("smsStats").textContent =
          `Characters: ${characters} | SMS Parts: ${smsParts}`;
      }

      async function copyCorrectionMessage() {
        const status = document.getElementById("copyStatus");

        const message = `Good day!

Please disregard the previous invoice as it was sent incorrectly due to a system-generated error. We sincerely apologize for any inconvenience this may have caused.

Kindly refer to the corrected invoice sent with this message.

Thank you for your understanding.`;

        try {
          await navigator.clipboard.writeText(message);
          status.textContent = "Correction message copied successfully.";

          setTimeout(() => {
            status.textContent = "";
          }, 2500);
        } catch {
          status.textContent = "Failed to copy correction message.";
        }
      }

      async function copySMS() {
        const sms = document.getElementById("smsPreview").value;

        const status = document.getElementById("copyStatus");

        try {
          await navigator.clipboard.writeText(sms);

          status.textContent = "SMS copied successfully.";

          setTimeout(() => {
            status.textContent = "";
          }, 2500);
        } catch {
          status.textContent = "Failed to copy SMS.";
        }
      }

      function clearForm() {
        fields.forEach((id) => {
          document.getElementById(id).value = "";
        });

        updatePreview();
      }

      updatePreview();
    </script>
  </body>
</html>
